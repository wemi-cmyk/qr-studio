<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef2ee;--panel:#fff;--ink:#12231a;--muted:#5a6b61;--line:#c9d4cc;--accent:#1f7a4d;--accent-ink:#fff;--err:#b42318;--canvas-bg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--panel:#16251c;--ink:#e8f0ea;--muted:#9bb0a2;--line:#2c4235;--accent:#3fb97c;--accent-ink:#06180e;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;font:inherit;font-weight:600;padding:11px 18px;cursor:pointer}
button.secondary{background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-weight:600;padding:11px 18px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.preview{text-align:center}
.frame{background:var(--canvas-bg);border:1px solid var(--line);border-radius:8px;padding:12px;min-height:260px;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;height:auto;display:none}
.empty{color:#5a6b61;font-size:.95rem;padding:20px}
.msg{min-height:1.5em;margin:12px 0 0;font-size:.95rem}
.msg.err{color:var(--err)}
.encoded{margin-top:10px;font-size:.85rem;color:var(--muted);word-break:break-all;text-align:left}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>QR Studio</h1>
  <p class="sub">Make a QR code from a saved link, any link, or an email. Download it as a PNG.</p>
  <div class="grid">
    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-preset" aria-selected="true" data-mode="preset">Saved link</button>
        <button class="tab" role="tab" id="t-link" aria-selected="false" data-mode="link">Any link</button>
        <button class="tab" role="tab" id="t-email" aria-selected="false" data-mode="email">Email</button>
      </div>

      <div id="p-preset">
        <label for="presetUrl">Saved link</label>
        <input id="presetUrl" type="url" value="https://www.google.com">
        <p class="hint">Pre-filled with your saved link. Change it here, or edit PRESET_LINK in the file to set a new default.</p>
      </div>

      <div id="p-link" class="hidden">
        <label for="anyUrl">Link to convert</label>
        <input id="anyUrl" type="url" placeholder="https://example.com">
        <p class="hint">Only http and https links are accepted.</p>
      </div>

      <div id="p-email" class="hidden">
        <label for="to">Recipient email</label>
        <input id="to" type="email" placeholder="name@example.com">
        <label for="subject">Subject <small>(optional)</small></label>
        <input id="subject" type="text">
        <label for="body">Message <small>(optional)</small></label>
        <textarea id="body"></textarea>
      </div>

      <div class="row">
        <button class="primary" id="gen">Generate QR code</button>
        <button class="secondary" id="dl" disabled>Download PNG</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <aside class="panel preview">
      <div class="frame">
        <div class="empty" id="empty">Your QR code will appear here.</div>
        <canvas id="cv" aria-label="Generated QR code"></canvas>
      </div>
      <div class="encoded" id="encoded"></div>
    </aside>
  </div>
</main>

<script>
// Change this to set the default link on the "Saved link" tab
var PRESET_LINK = 'https://www.google.com';

var MODES = {
  preset: { file: 'qr_code.png', size: 500 },
  link:   { file: 'qrcode.png',  size: 500 },
  email:  { file: 'email-qr.png', size: 400 }
};
var mode = 'preset';
var $ = function (id) { return document.getElementById(id); };
$('presetUrl').value = PRESET_LINK;

function setMsg(text, isErr) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (isErr ? ' err' : '');
}

document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () {
    mode = t.dataset.mode;
    document.querySelectorAll('.tab').forEach(function (x) {
      x.setAttribute('aria-selected', x === t ? 'true' : 'false');
    });
    ['preset', 'link', 'email'].forEach(function (m) {
      $('p-' + m).classList.toggle('hidden', m !== mode);
    });
    setMsg('');
  });
});

function cleanHttpUrl(raw) {
  var url;
  try { url = new URL(raw.trim()); } catch (e) { throw new Error('That does not look like a link. Include https:// at the start.'); }
  if (['http:', 'https:'].indexOf(url.protocol) === -1) throw new Error('Please enter a valid HTTP or HTTPS link.');
  return url.href;
}

function buildMailto() {
  var email = $('to').value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Enter a valid recipient email address.');
  var params = new URLSearchParams();
  if ($('subject').value.trim()) params.set('subject', $('subject').value);
  if ($('body').value.trim()) params.set('body', $('body').value);
  var q = params.toString().replace(/\+/g, '%20');
  return 'mailto:' + email + (q ? '?' + q : '');
}

function draw(text, size) {
  if (typeof qrcode === 'undefined') throw new Error('The QR library did not load. Check your internet connection and reload.');
  var qr = qrcode(0, 'H');
  qr.addData(text);
  qr.make();
  var n = qr.getModuleCount(), margin = 2, total = n + margin * 2;
  var cell = Math.max(1, Math.floor(size / total));
  var px = cell * total;
  var cv = $('cv');
  cv.width = px; cv.height = px;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#000000';
  for (var r = 0; r < n; r++)
    for (var c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
  cv.style.display = 'block';
  $('empty').style.display = 'none';
}

function generate() {
  try {
    var text;
    if (mode === 'preset') text = cleanHttpUrl($('presetUrl').value);
    else if (mode === 'link') text = cleanHttpUrl($('anyUrl').value);
    else text = buildMailto();
    draw(text, MODES[mode].size);
    $('encoded').textContent = text;
    $('dl').disabled = false;
    setMsg('QR code ready. Scan it to test, then download.');
  } catch (err) {
    $('dl').disabled = true;
    setMsg(err.message, true);
  }
}

$('gen').addEventListener('click', generate);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') generate();
});

$('dl').addEventListener('click', function () {
  $('cv').toBlob(function (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = MODES[mode].file;
    document.body.appendChild(a); a.click(); a.remove();
    setMsg('Saved as ' + MODES[mode].file);
  }, 'image/png');
});
</script>
</body>
</html>
